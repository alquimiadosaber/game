<!--
 * ══════════════════════════════════════════════════════════════════════════════
 * ALQUIMIA DO SABER — admin_vocations.html
 * ══════════════════════════════════════════════════════════════════════════════
 *
 * DESCRIÇÃO:
 *   Gestão de vocações pelo administrador. CRUD para as 60 carreiras vocacionais com fórmula epistémica e competências.
 *
 * ELEMENTOS PRINCIPAIS:
 *   • Grid de vocações com fórmula epistémica.
   • Formulário de criação/edição.
   • Seletor de domínio (A-F).
   • Campos de fórmula epistémica.
   • Editor de competências (lista).
   • Toggle de ativo/inativo.
   • Busca por título.
   • Importação em lote (CSV).
 *
 * INTEGRAÇÕES (google.script.run):
 *   • VocationController.getAllVocations() — listagem.
   • VocationController.createVocation() — criação.
   • VocationController.updateVocation() — edição.
   • VocationController.deleteVocation() — desativação.
   • DomainController.getAllDomains() — domínios.
   • ExportService.exportAllDataJSON() — exportação.
 * * Formula builder — construtor visual de fórmula epistémica.
   Bulk import — importação de múltiplas vocações.
   Domain assignment — vinculação a domínio.
   Competency editor — editor de lista de competências.
FUNCIONALIDADES ESPECÍFICAS:
 *   • Renderização server-side via scriptlets (<?= ?>).
 *   • Event listeners para interações do utilizador.
 *   • Feedback visual com toast notifications.
 *
 * PADRÕES:
 *   Vanilla JavaScript — sem dependências externas.
 *   Async handlers — .withSuccessHandler() e .withFailureHandler().
 *   Contextual escaping — injeção segura via scriptlets do HTML Service.
 *
 * AUTOR: Alquimia do Saber
 * VERSÃO: 1.0.0
 * ══════════════════════════════════════════════════════════════════════════════
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alquimia do Saber — Gestão de Vocações</title>
  <style>
    :root {
      --ia:#ff4d8d; --fil:#4cc9f0; --psi:#ff9e2c; --neu:#8b5cf6; --bio:#2dd4a0; --fis:#ffd23f; --soc:#00c2c7; --art:#ff6b6b;
      --bg1:#160f2e; --bg2:#2a1a52; --card:rgba(255,255,255,.06); --text:#f3eeff; --muted:#b7a8e0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Segoe UI",system-ui,sans-serif; background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg1) 70%);
      color:var(--text); min-height:100vh; padding:28px 20px 60px; }
    header { max-width:1400px; margin:0 auto 26px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
    header h1 { font-size:clamp(1.6rem,4vw,2.2rem); }
    .btn { padding:10px 20px; border:1px solid rgba(255,255,255,.2); border-radius:12px; background:var(--card);
      color:var(--text); cursor:pointer; font-size:.9rem; transition:all .2s; text-decoration:none; display:inline-flex;
      align-items:center; gap:8px; font-family:inherit; }
    .btn:hover { background:rgba(255,255,255,.1); }
    .btn-primary { background:var(--ia); border-color:var(--ia); font-weight:600; }
    .stats { max-width:1400px; margin:0 auto 24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; }
    .stat-card { background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:20px; text-align:center; }
    .stat-value { font-size:2rem; font-weight:800; margin-bottom:4px; }
    .stat-label { color:var(--muted); font-size:.85rem; }
    .filters { max-width:1400px; margin:0 auto 24px; background:var(--card); border:1px solid rgba(255,255,255,.12);
      border-radius:16px; padding:20px; display:flex; gap:12px; flex-wrap:wrap; }
    .filter-input, .filter-select { padding:10px 14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15);
      border-radius:8px; color:var(--text); font-size:.9rem; font-family:inherit; min-width:180px; }
    .vocation-grid { max-width:1400px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; }
    .vocation-card { background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:20px;
      transition:transform .2s,box-shadow .2s; }
    .vocation-card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(0,0,0,.4); }
    .vocation-header { display:flex; justify-content:space-between; align-items:start; margin-bottom:12px; }
    .vocation-title { font-size:1.1rem; font-weight:700; line-height:1.3; flex:1; }
    .domain-badge { padding:4px 10px; border-radius:999px; font-size:.75rem; font-weight:700; }
    .domain-A { background:rgba(139,92,246,.2); color:var(--neu); }
    .domain-B { background:rgba(45,212,160,.2); color:var(--bio); }
    .domain-C { background:rgba(0,194,199,.2); color:var(--soc); }
    .domain-D { background:rgba(255,107,107,.2); color:var(--art); }
    .domain-E { background:rgba(255,210,63,.2); color:var(--fis); }
    .domain-F { background:rgba(255,158,44,.2); color:var(--psi); }
    .formula { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .formula-item { padding:4px 10px; border-radius:8px; font-size:.8rem; font-weight:600; background:rgba(255,255,255,.08); }
    .vocation-desc { color:var(--muted); font-size:.85rem; line-height:1.5; margin-bottom:12px; }
    .vocation-actions { display:flex; gap:8px; }
    .toast { position:fixed; bottom:30px; right:30px; padding:16px 24px; background:var(--bio); border-radius:12px;
      color:white; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.3); opacity:0; transform:translateY(20px);
      transition:all .3s; z-index:1000; }
    .toast.show { opacity:1; transform:translateY(0); }
  </style>
<style>

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;

  :where(body) {
    min-width: 320px;
    max-width: 100%;

</style>
  <style id="fleet-mobile-wcag-aa">
    /* Contrato FROTA: ergonomia S20 e WCAG 2.1 AA. */
    html, body { max-width: 100%; overflow-x: hidden; }
    :is(button, [role="button"], input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea) {
      min-width: 48px !important;
      min-height: 48px !important;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <header>
    <h1>🧪 Gestão de Vocações</h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="createNewVocation()">+ Nova Vocação</button>
      <button class="btn" onclick="importVocationsCSV()">📥 Importar CSV</button>
      <button class="btn" onclick="exportVocationsJSON()">📤 Exportar JSON</button>
      <a href="?page=admin_dashboard" class="btn">← Dashboard</a>
    </div>
  </header>
  <div class="stats">
    <div class="stat-card"><div class="stat-value" id="totalVocations">0</div><div class="stat-label">Total de Vocações</div></div>
    <div class="stat-card"><div class="stat-value" id="domainA">0</div><div class="stat-label">Domínio A</div></div>
    <div class="stat-card"><div class="stat-value" id="domainB">0</div><div class="stat-label">Domínio B</div></div>
    <div class="stat-card"><div class="stat-value" id="domainC">0</div><div class="stat-label">Domínio C</div></div>
    <div class="stat-card"><div class="stat-value" id="domainD">0</div><div class="stat-label">Domínio D</div></div>
    <div class="stat-card"><div class="stat-value" id="domainE">0</div><div class="stat-label">Domínio E</div></div>
    <div class="stat-card"><div class="stat-value" id="domainF">0</div><div class="stat-label">Domínio F</div></div>
  </div>
  <div class="filters">
    <input inputmode="text" type="text" class="filter-input" id="searchInput" placeholder="🔍 Buscar por título...">
    <select class="filter-select" id="domainFilter">
      <option value="">Todos os domínios</option>
      <option value="A">Domínio A - Cognição & IA</option>
      <option value="B">Domínio B - Biotecnologia</option>
      <option value="C">Domínio C - Sociedade Digital</option>
      <option value="D">Domínio D - Arte & Design</option>
      <option value="E">Domínio E - Computação Avançada</option>
      <option value="F">Domínio F - Neuropsicologia</option>
    </select>
    <button class="btn btn-primary" onclick="applyFilters()">Filtrar</button>
    <button class="btn" onclick="clearFilters()">Limpar</button>
  </div>
  <div class="vocation-grid" id="vocationGrid"></div>
  <div class="toast" id="toast"></div>
  <script>
    var DEMO_VOCATIONS=[
      {id:1,title:'Engenharia de IA Ética',domain:'A',formula:{IA:6,FIL:5,NEU:4},description:'Desenvolvimento de sistemas de IA com responsabilidade ética e social.',competencies:['Machine Learning','Ética Computacional','Design Centrado no Humano']},
      {id:2,title:'Bioengenharia Genética',domain:'B',formula:{BIO:7,FIS:4,IA:3},description:'Manipulação e engenharia de sistemas biológicos para inovação médica.',competencies:['CRISPR','Bioinformática','Genética Molecular']},
      {id:3,title:'Arquitetura de Políticas Digitais',domain:'C',formula:{SOC:6,FIL:5,IA:3},description:'Design de frameworks regulatórios para tecnologias emergentes.',competencies:['Governança Digital','Direito Tecnológico','Análise de Impacto Social']},
      {id:4,title:'Design Generativo & Arte Computacional',domain:'D',formula:{ART:7,IA:5,PSI:2},description:'Criação artística usando algoritmos generativos e inteligência artificial.',competencies:['Algoritmos Criativos','UX/UI','Estética Digital']},
      {id:5,title:'Física Quântica Computacional',domain:'E',formula:{FIS:7,FIL:4,IA:4},description:'Desenvolvimento de algoritmos quânticos e computação de próxima geração.',competencies:['Mecânica Quântica','Algoritmos Quânticos','Criptografia']},
      {id:6,title:'Neurociência Cognitiva Digital',domain:'F',formula:{PSI:6,NEU:5,IA:4},description:'Estudo da cognição humana com ferramentas de neuroimagem e IA.',competencies:['fMRI','Neuropsicologia','Modelagem Cognitiva']}
    ];
    var filteredVocations=[],filters={search:'',domain:''};
    function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}
    function updateStats(vocations){document.getElementById('totalVocations').textContent=vocations.length;['A','B','C','D','E','F'].forEach(function(d){document.getElementById('domain'+d).textContent=vocations.filter(function(v){return v.domain===d;}).length;});}
    function filterVocations(vocations){return vocations.filter(function(v){if(filters.search&&!v.title.toLowerCase().includes(filters.search.toLowerCase()))return false;if(filters.domain&&v.domain!==filters.domain)return false;return true;});}
    function renderVocations(vocations){var grid=document.getElementById('vocationGrid');grid.innerHTML='';if(vocations.length===0){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);"><div style="font-size:3rem;margin-bottom:16px;">🧪</div><h3>Nenhuma vocação encontrada</h3><p>Tente ajustar os filtros ou criar uma nova vocação.</p></div>';return;}vocations.forEach(function(v){var card=document.createElement('div');card.className='vocation-card';var formulaHTML='';Object.keys(v.formula).forEach(function(k){formulaHTML+='<span class="formula-item">'+k+': '+v.formula[k]+'</span>';});card.innerHTML='<div class="vocation-header"><div class="vocation-title">'+v.title+'</div><span class="domain-badge domain-'+v.domain+'">'+v.domain+'</span></div><div class="formula">'+formulaHTML+'</div><div class="vocation-desc">'+v.description+'</div><div class="vocation-actions"><button class="btn" style="padding:8px 14px;font-size:.85rem;" onclick="editVocation('+v.id+')">✏️ Editar</button><button class="btn" style="padding:8px 14px;font-size:.85rem;" onclick="deleteVocation('+v.id+')">🗑️</button></div>';grid.appendChild(card);});}
    function applyFilters(){filters.search=document.getElementById('searchInput').value;filters.domain=document.getElementById('domainFilter').value;filteredVocations=filterVocations(DEMO_VOCATIONS);renderVocations(filteredVocations);}
    function clearFilters(){document.getElementById('searchInput').value='';document.getElementById('domainFilter').value='';filters={search:'',domain:''};filteredVocations=DEMO_VOCATIONS;renderVocations(filteredVocations);}
    function editVocation(id){showToast('Edição de vocação #'+id+' a implementar');}
    function deleteVocation(id){if(confirm('Tem certeza que deseja desativar esta vocação?')){showToast('Vocação desativada com sucesso!');}}
    function createNewVocation(){
      var title=prompt('Título da vocação:');
      if(!title||title.trim().length<5){showToast('Título deve ter no mínimo 5 caracteres');return;}
      title=title.trim();
      var domain=prompt('Domínio (A-F):');
      if(!domain){showToast('Domínio é obrigatório');return;}
      domain=domain.toUpperCase().trim();
      if(!'ABCDEF'.includes(domain)||domain.length!==1){showToast('✗ Domínio inválido! Use A, B, C, D, E ou F');return;}
      var desc=prompt('Descrição breve (mínimo 10 caracteres):');
      if(!desc||desc.trim().length<10){showToast('Descrição deve ter no mínimo 10 caracteres');return;}
      desc=desc.trim();
      var formula={};
      var dimensions=['IA','FIL','PSI','NEU','BIO','FIS','SOC','ART'];
      var totalWeight=0;
      for(var i=0;i<dimensions.length;i++){
        var dim=dimensions[i];
        var val=prompt('Fórmula '+dim+' (0-10):');
        if(val===null)return;
        val=parseInt(val);
        if(isNaN(val)||val<0||val>10){showToast('✗ Valor inválido para '+dim+'. Use número entre 0 e 10');return;}
        formula[dim]=val;
        totalWeight+=val;
      }
      if(totalWeight===0){showToast('✗ Fórmula epistémica inválida: pelo menos uma dimensão deve ser maior que 0');return;}
      showToast('📝 Criando vocação...');
      google.script.run.withSuccessHandler(function(r){
        if(r&&r.success){showToast('✓ Vocação criada com sucesso!');setTimeout(loadVocations,500);}
        else{showToast('✗ Erro ao criar: '+(r&&r.error?r.error:'Desconhecido'));}
      }).withFailureHandler(function(e){showToast('✗ Falha na criação: '+e.message);}).api_createVocation({Title:title,Domain:domain,Description:desc,EpistemicFormula:JSON.stringify(formula),IsActive:true});
    }
    function importVocationsCSV(){
      var input=document.createElement('input');
      input.type='file';
      input.accept='.csv,.json';
      input.onchange=function(e){
        var file=e.target.files[0];
        if(!file){showToast('Nenhum arquivo selecionado');return;}
        if(file.size>5*1024*1024){showToast('✗ Arquivo muito grande (máximo 5MB)');return;}
        
        var format=file.name.toLowerCase().endsWith('.json')?'json':'csv';
        var mode='append';
        
        if(confirm('Modo de importação:\n\nOK = ADICIONAR (append) - mantém vocações existentes\nCancelar = SUBSTITUIR (replace) - desativa todas as existentes')){
          mode='append';
        }else{
          if(!confirm('⚠️ ATENÇÃO: Modo SUBSTITUIR desativará todas as vocações existentes.\n\nTem certeza?'))return;
          mode='replace';
        }
        
        var reader=new FileReader();
        reader.onload=function(ev){
          var content=ev.target.result;
          if(content.length<10){showToast('✗ Arquivo vazio ou inválido');return;}
          
          showToast('📥 Importando vocações...');
          
          google.script.run
            .withSuccessHandler(function(result){
              if(result&&result.success){
                var summary='✓ Importação concluída!\n\n';
                summary+='Criadas: '+result.data.created+'\n';
                summary+='Atualizadas: '+result.data.updated+'\n';
                summary+='Ignoradas: '+result.data.skipped+'\n';
                summary+='Total: '+result.data.total;
                
                if(result.data.errors&&result.data.errors.length>0){
                  summary+='\n\n⚠️ Erros ('+result.data.errors.length+'):\n'+result.data.errors.slice(0,5).join('\n');
                  if(result.data.errors.length>5)summary+='\n... e mais '+(result.data.errors.length-5)+' erros';
                }
                
                alert(summary);
                showToast('✓ Vocações importadas: '+result.data.created+' criadas, '+result.data.updated+' atualizadas');
                setTimeout(loadVocations,500);
              }else{
                showToast('✗ Erro na importação: '+(result&&result.error?result.error:'Desconhecido'));
              }
            })
            .withFailureHandler(function(error){
              showToast('✗ Falha na importação: '+error.message);
            })
            .api_importVocations({data:content,format:format,mode:mode});
        };
        reader.onerror=function(){showToast('✗ Erro ao ler arquivo');};
        reader.readAsText(file);
      };
      input.click();
    }
    function exportVocationsJSON(){
      showToast('📤 Exportando vocações...');
      google.script.run.withSuccessHandler(function(r){
        if(r&&r.success&&r.data&&r.data.json){
          var jsonData=JSON.parse(r.data.json);
          var vocationsOnly={exportDate:jsonData.exportDate,version:'1.0',vocations:jsonData.tables.Vocations||[]};
          var blob=new Blob([JSON.stringify(vocationsOnly,null,2)],{type:'application/json;charset=utf-8;'});
          var url=window.URL.createObjectURL(blob);
          var a=document.createElement('a');
          a.href=url;
          a.download='vocations_'+new Date().toISOString().slice(0,10)+'.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
          showToast('✓ JSON exportado com sucesso! ('+vocationsOnly.vocations.length+' vocações)');
        }else{showToast('✗ Erro ao exportar: '+(r&&r.error?r.error:'Sem dados'));}
      }).withFailureHandler(function(e){showToast('✗ Falha na exportação: '+e.message);}).api_exportAllDataJSON();
    }
    function loadVocations(){if(typeof google!=='undefined'&&google.script&&google.script.run){google.script.run.withSuccessHandler(function(r){var vocations=r&&r.success&&r.data?r.data:DEMO_VOCATIONS;filteredVocations=vocations;updateStats(vocations);renderVocations(filteredVocations);}).withFailureHandler(function(){filteredVocations=DEMO_VOCATIONS;updateStats(DEMO_VOCATIONS);renderVocations(filteredVocations);}).api_getVocations();}else{filteredVocations=DEMO_VOCATIONS;updateStats(DEMO_VOCATIONS);renderVocations(filteredVocations);}}
    loadVocations();
  </script>
</body>
</html>
