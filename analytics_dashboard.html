<!--
 * ══════════════════════════════════════════════════════════════════════════════
 * ALQUIMIA DO SABER — analytics_dashboard.html
 * ══════════════════════════════════════════════════════════════════════════════
 *
 * DESCRIÇÃO:
 *   Dashboard de analytics agregado. Visualizações de dados do sistema: utilização, vocações populares, distribuição de vectores e engajamento.
 *
 * ELEMENTOS PRINCIPAIS:
 *   • Gráfico de utilização diária/semanal.
   • Distribuição de vocações recomendadas.
   • Mapa de calor de vectores psicométricos.
   • Métricas de engajamento (cenários/dia).
   • Top utilizadores por XP.
   • Gráfico de domínios mais populares.
   • Indicadores de sistema (quota, cache).
 *
 * INTEGRAÇÕES (google.script.run):
 *   • AnalyticsService.getSystemStatistics() — estatísticas.
   • AnalyticsService.getVocationPopularity() — vocações populares.
   • AnalyticsService.getDimensionDistribution() — distribuição.
   • AnalyticsService.getEngagementMetrics() — engajamento.
   • TriggerService.quotaCheck() — quota de triggers.
 * * Real-time data — dados atualizados em tempo real.
   Chart visualizations — gráficos interativos.
   System health — indicadores de saúde do sistema.
FUNCIONALIDADES ESPECÍFICAS:
 *   • Renderização server-side via scriptlets (<?= ?>).
 *   • Event listeners para interações do utilizador.
 *   • Feedback visual com toast notifications.
 *
 * PADRÕES:
 *   Vanilla JavaScript — sem dependências externas.
 *   Async handlers — .withSuccessHandler() e .withFailureHandler().
 *   Contextual escaping — injeção segura via scriptlets do HTML Service.
 *
 * AUTOR: Alquimia do Saber
 * VERSÃO: 1.0.0
 * ══════════════════════════════════════════════════════════════════════════════
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alquimia do Saber — Dashboard Analítico</title>
  <style>
    :root{--ia:#ff4d8d;--fil:#4cc9f0;--psi:#ff9e2c;--neu:#8b5cf6;--bio:#2dd4a0;--fis:#ffd23f;--bg1:#160f2e;--bg2:#2a1a52;--card:rgba(255,255,255,.06);--text:#f3eeff;--muted:#b7a8e0;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg1) 70%);color:var(--text);min-height:100vh;padding:28px 20px 60px;}
    header{max-width:1400px;margin:0 auto 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
    header h1{font-size:clamp(1.6rem,4vw,2.2rem);}
    .btn{padding:10px 20px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer;font-size:.9rem;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;}
    .btn:hover{background:rgba(255,255,255,.1);}
    .grid{max-width:1400px;margin:0 auto;display:grid;gap:20px;}
    .grid-2{grid-template-columns:1fr 1fr;}
    .grid-3{grid-template-columns:repeat(3,1fr);}
    @media (max-width:1024px){.grid-2,.grid-3{grid-template-columns:1fr;}}
    .widget{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:24px;}
    .widget-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    .widget-title{font-size:1.2rem;font-weight:700;}
    .chart-area{height:300px;background:rgba(255,255,255,.03);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;}
    .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;}
    .metric{text-align:center;padding:16px;background:rgba(255,255,255,.03);border-radius:12px;}
    .metric-value{font-size:1.8rem;font-weight:800;margin-bottom:4px;}
    .metric-label{font-size:.8rem;color:var(--muted);}
    .bar-chart{display:flex;flex-direction:column;gap:12px;}
    .bar-item{display:flex;align-items:center;gap:12px;}
    .bar-label{min-width:120px;font-size:.85rem;}
    .bar-bg{flex:1;height:24px;background:rgba(255,255,255,.08);border-radius:12px;overflow:hidden;position:relative;}
    .bar-fill{height:100%;border-radius:12px;background:linear-gradient(90deg,var(--ia),var(--fil));transition:width .6s ease;}
    .bar-value{font-size:.8rem;color:var(--muted);min-width:40px;text-align:right;}
  </style>
<style>
/* codex-s20-mobile-first: Samsung S20 / Chrome mobile baseline (360x800 CSS px) */
@media screen {
  :where(html) {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  :where(*, *::before, *::after) {
    box-sizing: border-box;
  }
  :where(body) {
    min-width: 320px;
    max-width: 100%;
    overflow-x: hidden;
  }
  :where(main, .app, .page, .container, .content, .main-content, .dashboard, .view) {
    max-width: 100%;
  }
  :where(img, video, canvas, svg) {
    max-width: 100%;
    height: auto;
  }
  :where(p, li, td, th, label, legend, button, a, h1, h2, h3, h4, h5, h6) {
    overflow-wrap: anywhere;
  }
  :where(input, select, textarea, button) {
    font: inherit;
    max-width: 100%;
  }
  :where(input, select, textarea) {
    font-size: max(16px, 1rem);
  }
  :where(button, [role="button"], input, select, textarea, a) {
    touch-action: manipulation;
  }
  :where(.table-wrap, .table-wrapper, .table-responsive, .table-container, .responsive-table, .data-table-wrapper) {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
}
@media (max-width: 480px) {
  :where(body) {
    font-size: 16px;
  }
  :where(.grid, .cards, .dashboard-grid, .stats-grid, .form-grid, .filters-grid) {
    grid-template-columns: 1fr !important;
  }
  :where(.toolbar, .actions, .button-row, .filters, .form-actions, .modal-actions, .header-actions) {
    flex-direction: column;
    align-items: stretch;
  }
  :where(.btn, button, input, select, textarea) {
    min-height: 44px;
  }
  :where(table) {
    display: block;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  :where(th, td) {
    white-space: nowrap;
  }
  :where(.card, .panel, .modal, .dialog, .drawer) {
    max-width: calc(100vw - 24px);
  }
}
@media (max-width: 360px) {
  :where(body) {
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
  :where(.card, .panel, .section, .modal-content, .dialog-content) {
    padding: 12px;
  }
  :where(h1) {
    font-size: clamp(1.45rem, 1.2rem + 2vw, 2rem);
  }
  :where(h2) {
    font-size: clamp(1.2rem, 1rem + 1.4vw, 1.55rem);
  }
}
</style>
  <style id="fleet-mobile-wcag-aa">
    /* Contrato FROTA: ergonomia S20 e WCAG 2.1 AA. */
    html, body { max-width: 100%; overflow-x: hidden; }
    :is(button, [role="button"], input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea) {
      min-width: 48px !important;
      min-height: 48px !important;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <header>
    <h1>📊 Dashboard Analítico</h1>
    <a href="?page=admin_dashboard" class="btn">← Dashboard Admin</a>
  </header>
  <div class="grid">
    <div class="widget">
      <div class="widget-header"><h2 class="widget-title">📈 Utilização nos Últimos 30 Dias</h2></div>
      <div class="chart-area">Gráfico de linha com utilização diária (integração futura com Chart.js)</div>
    </div>
    <div class="grid grid-2" style="grid-column:1/-1;">
      <div class="widget">
        <div class="widget-header"><h2 class="widget-title">🏆 Vocações Mais Recomendadas</h2></div>
        <div class="bar-chart" id="topVocations"></div>
      </div>
      <div class="widget">
        <div class="widget-header"><h2 class="widget-title">🎯 Distribuição por Domínio</h2></div>
        <div class="bar-chart" id="domainDist"></div>
      </div>
    </div>
    <div class="widget">
      <div class="widget-header"><h2 class="widget-title">📊 Métricas de Engajamento</h2></div>
      <div class="metric-grid">
        <div class="metric"><div class="metric-value" id="avgScenarios">0</div><div class="metric-label">Cenários/Dia</div></div>
        <div class="metric"><div class="metric-value" id="avgTime">0</div><div class="metric-label">Min/Sessão</div></div>
        <div class="metric"><div class="metric-value" id="completionRate">0%</div><div class="metric-label">Taxa Conclusão</div></div>
      </div>
    </div>
  </div>
  <script>
    var DEMO={vocations:[{name:'Engenharia de IA',count:145},{name:'Ciência de Dados',count:132},{name:'Neurociência',count:98},{name:'Design UX',count:87},{name:'Biotecnologia',count:76}],domains:[{name:'Domínio A',count:178},{name:'Domínio B',count:154},{name:'Domínio C',count:142},{name:'Domínio D',count:118},{name:'Domínio E',count:96},{name:'Domínio F',count:134}],engagement:{avgScenarios:3.2,avgTime:24,completionRate:78}};
    function renderBarChart(container,data){var max=Math.max.apply(null,data.map(function(d){return d.count;}));container.innerHTML='';data.forEach(function(d){var item=document.createElement('div');item.className='bar-item';var percent=(d.count/max*100).toFixed(1);item.innerHTML='<div class="bar-label">'+d.name+'</div><div class="bar-bg"><div class="bar-fill" style="width:'+percent+'%"></div></div><div class="bar-value">'+d.count+'</div>';container.appendChild(item);});}
    function loadAnalytics(){renderBarChart(document.getElementById('topVocations'),DEMO.vocations);renderBarChart(document.getElementById('domainDist'),DEMO.domains);document.getElementById('avgScenarios').textContent=DEMO.engagement.avgScenarios;document.getElementById('avgTime').textContent=DEMO.engagement.avgTime;document.getElementById('completionRate').textContent=DEMO.engagement.completionRate+'%';}
    loadAnalytics();
  </script>
</body>
</html>
