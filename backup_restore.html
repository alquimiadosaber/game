<!--
 * ══════════════════════════════════════════════════════════════════════════════
 * ALQUIMIA DO SABER — backup_restore.html
 * ══════════════════════════════════════════════════════════════════════════════
 *
 * DESCRIÇÃO:
 *   Interface de backup e restauração de dados. Criar backups manuais, listar backups existentes, restaurar e agendar automáticos.
 *
 * ELEMENTOS PRINCIPAIS:
 *   • Botão de criar backup manual.
   • Lista de backups existentes.
   • Botão de restaurar backup.
   • Agendamento de backup automático.
   • Tamanho do backup.
   • Data de criação do backup.
   • Verificação de integridade.
 *
 * INTEGRAÇÕES (google.script.run):
 *   • ExportService.backupAllData() — criação de backup.
   • ImportService.importAllData() — restauração.
   • TriggerService.installDailyTrigger() — agendamento.
   • LoggerService.log() — registro do backup.
   • ConfigService.getSetting() — configurações de backup.
 * * Manual + automatic — backups manuais e automáticos.
   Integrity check — verificação de integridade do backup.
   Point-in-time restore — restauração pontual.
   Scheduled backups — agendamento via triggers.
FUNCIONALIDADES ESPECÍFICAS:
 *   • Renderização server-side via scriptlets (<?= ?>).
 *   • Event listeners para interações do utilizador.
 *   • Feedback visual com toast notifications.
 *
 * PADRÕES:
 *   Vanilla JavaScript — sem dependências externas.
 *   Async handlers — .withSuccessHandler() e .withFailureHandler().
 *   Contextual escaping — injeção segura via scriptlets do HTML Service.
 *
 * AUTOR: Alquimia do Saber
 * VERSÃO: 1.0.0
 * ══════════════════════════════════════════════════════════════════════════════
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alquimia do Saber — Backup & Restauração</title>
  <style>
    :root{--ia:#ff4d8d;--fil:#4cc9f0;--bio:#2dd4a0;--bg1:#160f2e;--bg2:#2a1a52;--card:rgba(255,255,255,.06);--text:#f3eeff;--muted:#b7a8e0;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg1) 70%);color:var(--text);min-height:100vh;padding:28px 20px 60px;}
    header{max-width:1200px;margin:0 auto 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
    header h1{font-size:clamp(1.6rem,4vw,2.2rem);}
    .btn{padding:10px 20px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer;font-size:.9rem;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-family:inherit;}
    .btn:hover{background:rgba(255,255,255,.1);}
    .btn-primary{background:var(--ia);border-color:var(--ia);font-weight:600;}
    .container{max-width:1200px;margin:0 auto;}
    .section{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px;margin-bottom:24px;}
    .section-title{font-size:1.3rem;font-weight:700;margin-bottom:20px;}
    .backup-list{list-style:none;}
    .backup-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:16px;}
    .backup-info{flex:1;}
    .backup-name{font-weight:700;margin-bottom:4px;}
    .backup-meta{font-size:.85rem;color:var(--muted);}
    .backup-actions{display:flex;gap:8px;}
    .toggle{position:relative;display:inline-block;width:52px;height:28px;}
    .toggle input{opacity:0;width:0;height:0;}
    .slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.2);border-radius:28px;transition:.3s;}
    .slider:before{position:absolute;content:"";height:20px;width:20px;left:4px;bottom:4px;background:white;border-radius:50%;transition:.3s;}
    input:checked+.slider{background:var(--bio);}
    input:checked+.slider:before{transform:translateX(24px);}
    .toast{position:fixed;bottom:30px;right:30px;padding:16px 24px;background:var(--bio);border-radius:12px;color:white;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(20px);transition:all .3s;z-index:1000;}
    .toast.show{opacity:1;transform:translateY(0);}
  </style>
<style>

  :where(html) {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  :where(*, *::before, *::after) {
    box-sizing: border-box;
  }
  :where(body) {
    min-width: 320px;
    max-width: 100%;
    overflow-x: hidden;
  }
  :where(main, .app, .page, .container, .content, .main-content, .dashboard, .view) {
    max-width: 100%;
  }
  :where(img, video, canvas, svg) {
    max-width: 100%;
    height: auto;
  }
  :where(p, li, td, th, label, legend, button, a, h1, h2, h3, h4, h5, h6) {
    overflow-wrap: anywhere;
  }
  :where(input, select, textarea, button) {
    font: inherit;
    max-width: 100%;
  }
  :where(input, select, textarea) {
    font-size: max(16px, 1rem);
  }
  :where(button, [role="button"], input, select, textarea, a) {
    touch-action: manipulation;
  }
  :where(.table-wrap, .table-wrapper, .table-responsive, .table-container, .responsive-table, .data-table-wrapper) {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
}
@media (max-width: 480px) {
  :where(body) {
    font-size: 16px;
  }
  :where(.grid, .cards, .dashboard-grid, .stats-grid, .form-grid, .filters-grid) {
    grid-template-columns: 1fr !important;
  }
  :where(.toolbar, .actions, .button-row, .filters, .form-actions, .modal-actions, .header-actions) {
    flex-direction: column;
    align-items: stretch;
  }
  :where(.btn, button, input, select, textarea) {
    min-height: 44px;
  }
  :where(table) {
    display: block;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

    white-space: nowrap;
  }

    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
  :where(.card, .panel, .section, .modal-content, .dialog-content) {
    padding: 12px;
  }
  :where(h1) {
    font-size: clamp(1.45rem, 1.2rem + 2vw, 2rem);
  }
  :where(h2) {

  }

</style>
  <style id="fleet-mobile-wcag-aa">
    /* Contrato FROTA: ergonomia S20 e WCAG 2.1 AA. */
    html, body { max-width: 100%; overflow-x: hidden; }
    :is(button, [role="button"], input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea) {
      min-width: 48px !important;
      min-height: 48px !important;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <header>
    <h1>💾 Backup & Restauração</h1>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="createBackupBtn" type="button">+ Criar Backup Manual</button>
      <a href="?page=admin_dashboard" class="btn" id="dashboardLink">← Dashboard</a>
    </div>
  </header>
  <div class="container">
    <div class="section">
      <div class="section-title">⚙️ Configuração de Backup Automático</div>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
        <label style="font-weight:600;">Backup Automático Diário</label>
        <label class="toggle"><input type="checkbox" id="autoBackup" disabled aria-describedby="backupScheduleNote"><span class="slider"></span></label>
      </div>
      <p id="backupScheduleNote" style="color:var(--muted);font-size:.9rem;">O agendamento automático ainda não está exposto pelo backend. O controle ficará disponível quando houver um trigger dedicado e auditável.</p>
    </div>
    <div class="section">
      <div class="section-title">📂 Backups Disponíveis</div>
      <p id="backupStatus" role="status" aria-live="polite" style="color:var(--muted);font-size:.9rem;margin-bottom:14px;">Carregando backups…</p>
      <ul class="backup-list" id="backupList"></ul>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    (function () {
      var backupInFlight = false;
      var authToken = '';
      try {
        authToken = new URLSearchParams(window.location.search).get('token') ||
          localStorage.getItem('alquimia_session_token') || '';
      } catch (error) {}

      function setStatus(message) {
        var status = document.getElementById('backupStatus');
        if (status) status.textContent = message;
      }

      function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function () { t.classList.remove('show'); }, 3000);
      }

      function setCreateBusy(busy) {
        backupInFlight = busy;
        var button = document.getElementById('createBackupBtn');
        if (!button) return;
        button.disabled = busy;
        button.setAttribute('aria-busy', busy ? 'true' : 'false');
        button.textContent = busy ? '⏳ Criando backup…' : '+ Criar Backup Manual';
      }

      function formatTimestamp(value) {
        var date = new Date(value);
        return isNaN(date.getTime()) ? String(value || 'Data indisponível') :
          date.toLocaleString('pt-BR');
      }

      function disabledAction(label, reason) {
        var button = document.createElement('button');
        button.className = 'btn';
        button.type = 'button';
        button.disabled = true;
        button.title = reason;
        button.setAttribute('aria-label', label + ': ' + reason);
        button.textContent = label;
        return button;
      }

      function renderBackups(backups) {
        var list = document.getElementById('backupList');
        list.replaceChildren();
        var items = Array.isArray(backups) ? backups : [];
        if (!items.length) {
          var empty = document.createElement('li');
          empty.className = 'backup-item';
          empty.textContent = 'Nenhum backup registrado.';
          list.appendChild(empty);
          return;
        }
        items.forEach(function (backup) {
          var item = document.createElement('li');
          item.className = 'backup-item';

          var info = document.createElement('div');
          info.className = 'backup-info';
          var name = document.createElement('div');
          name.className = 'backup-name';
          name.textContent = backup.id || 'Backup sem identificador';
          var meta = document.createElement('div');
          meta.className = 'backup-meta';
          meta.textContent = 'Status: ' + (backup.status || 'desconhecido') +
            ' • ' + formatTimestamp(backup.timestamp) +
            ' • ' + (Number(backup.tableCount || 0) || 0) + ' abas';
          info.appendChild(name);
          info.appendChild(meta);

          var actions = document.createElement('div');
          actions.className = 'backup-actions';
          actions.appendChild(disabledAction('♻️ Restaurar', 'Restauração ainda não possui endpoint seguro.'));
          actions.appendChild(disabledAction('🗑️ Excluir', 'Exclusão ainda não possui endpoint seguro.'));

          item.appendChild(info);
          item.appendChild(actions);
          list.appendChild(item);
        });
      }

      function loadBackups() {
        if (!authToken || typeof google === 'undefined' || !google.script || !google.script.run) {
          setStatus('Sessão administrativa indisponível. Entre novamente para carregar os backups.');
          renderBackups([]);
          return;
        }
        setStatus('Carregando backups…');
        google.script.run
          .withSuccessHandler(function (result) {
            if (!result || !result.success) {
              setStatus((result && result.error) || 'Não foi possível carregar os backups.');
              renderBackups([]);
              return;
            }
            renderBackups(result.data);
            setStatus((result.data || []).length + ' backup(s) registrado(s).');
          })
          .withFailureHandler(function () {
            setStatus('Não foi possível carregar os backups. Tente novamente.');
            renderBackups([]);
          })
          .api_listBackups(authToken);
      }

      function createBackup() {
        if (backupInFlight) return;
        if (!authToken || typeof google === 'undefined' || !google.script || !google.script.run) {
          setStatus('Sessão administrativa indisponível. Entre novamente para criar um backup.');
          showToast('Sessão expirada. Faça login novamente.');
          return;
        }
        setCreateBusy(true);
        setStatus('Criando backup…');
        showToast('🔄 Criando backup... Aguarde.');
        google.script.run
          .withSuccessHandler(function (result) {
            setCreateBusy(false);
            if (!result || !result.success) {
              setStatus((result && result.error) || 'Não foi possível criar o backup. Tente novamente.');
              showToast('Não foi possível criar o backup.');
              return;
            }
            setStatus('Backup criado com sucesso.');
            showToast('✅ Backup criado com sucesso!');
            loadBackups();
          })
          .withFailureHandler(function () {
            setCreateBusy(false);
            setStatus('Não foi possível criar o backup. Tente novamente.');
            showToast('Não foi possível criar o backup.');
          })
          .api_backupAllData(authToken);
      }

      var dashboardLink = document.getElementById('dashboardLink');
      if (dashboardLink && authToken) {
        dashboardLink.href = '?page=admin_dashboard&token=' + encodeURIComponent(authToken);
      }
      document.getElementById('createBackupBtn').addEventListener('click', createBackup);
      loadBackups();
    }());
  </script>
</body>
</html>
