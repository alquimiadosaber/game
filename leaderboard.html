 *
 * DESCRIÇÃO:
 *   Painel formativo do percurso. A visualização protege nomes e deixa claro
 *   que pontos não medem inteligência, potencial ou aprendizagem.
 *
 * ELEMENTOS PRINCIPAIS:
 *   • Ranking global com top 20 utilizadores.
   • Posição do utilizador corrente.
   • Medalhas (ouro, prata, bronze).
   • Filtro por turma.
   • Comparação lado a lado.
   • Histórico de posições.
   • Botão de compartilhar posição.
 *
 * INTEGRAÇÕES (google.script.run):
 *   • ScoreRankingService.getGlobalRanking(limit) — ranking global.
   • ScoreRankingService.getClassroomRanking(classId) — ranking turma.
   • ScoreRankingService.getUserPercentile(userId) — percentil.
   • UserController.getAllUsers() — dados dos utilizadores.
 * * Gamification — motivação por competição.
   Real-time updates — posição atualizada após cada cenário.
   Comparison view — comparação direta entre utilizadores.
FUNCIONALIDADES ESPECÍFICAS:
 *   • Renderização server-side via scriptlets (<?= ?>).
 *   • Event listeners para interações do utilizador.
 *   • Feedback visual com toast notifications.
 *
 * PADRÕES:
 *   Vanilla JavaScript — sem dependências externas.
 *   Async handlers — .withSuccessHandler() e .withFailureHandler().
 *   Contextual escaping — injeção segura via scriptlets do HTML Service.
 *

 * VERSÃO: 1.0.0
 * ══════════════════════════════════════════════════════════════════════════════

<body>
  <main class="painel">
    <h1>Meu percurso</h1>
    <p class="sub">
      Pontos registram atividades concluídas. Eles não medem inteligência, não
      indicam profissão e não devem ser usados como nota.
    </p>

    <div id="rankingVizinhanca" role="status" aria-live="polite">
      <p class="sub">Carregando sua posição…</p>
    </div>

    <a class="voltar" href="<?!= getScriptUrl() ?>?page=result_dashboard&amp;token=<?!= encodeURIComponent(session && session.token ? session.token : '') ?>" target="_top">← Voltar aos resultados</a>
  </main>

  <?!= include('RankingVizinhancaPartial') ?>
  <script>
    (function () {
      // O token viaja na URL porque o Apps Script nao tem sessao entre doGet.
      var token = '<?= session && session.sessionId ? session.sessionId : "" ?>';
      var destino = document.getElementById('rankingVizinhanca');

      function mostrarMensagem(texto) {
        destino.replaceChildren();
        var mensagem = document.createElement('p');
        mensagem.className = 'sub';
        mensagem.textContent = String(texto || 'Não foi possível carregar o percurso.');
        destino.appendChild(mensagem);
      }

      if (!token || typeof google === 'undefined' || !google.script || !google.script.run) {
        mostrarMensagem('Entre no laboratório para rever seu percurso.');
        return;
      }

      google.script.run
        .withSuccessHandler(function (resultado) {
          if (resultado && resultado.success) {
            RankingVizinhanca.render(destino, resultado.data);
          } else {
            mostrarMensagem((resultado && resultado.error) ||
              'Não foi possível carregar o percurso.');
          }
        })
        .withFailureHandler(function (erro) {
          mostrarMensagem('Falha ao falar com o servidor: ' +
            (erro && erro.message ? erro.message : erro));
        })
        .api_getRankingVizinhanca(token);
    }());
  </script>
  <?!= include('HealthCheck') ?>
</body>
