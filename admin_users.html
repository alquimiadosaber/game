<!--
 * ══════════════════════════════════════════════════════════════════════════════
 * ALQUIMIA DO SABER — admin_users.html
 * ══════════════════════════════════════════════════════════════════════════════
 *
 * DESCRIÇÃO:
 *   Gestão de utilizadores pelo administrador. Interface CRUD completa com tabela, busca, filtros, criação e edição inline.
 *
 * ELEMENTOS PRINCIPAIS:
 *   • Tabela de utilizadores (ID, nome, e-mail, papel, status).
   • Busca por nome/e-mail.
   • Filtro por papel e status.
   • Botão de criar novo utilizador.
   • Botão de editar utilizador (inline).
   • Botão de desativar utilizador.
   • Paginação da tabela.
   • Contagem total de utilizadores.
 *
 * INTEGRAÇÕES (google.script.run):
 *   • UserController.getAllUsers() — listagem.
   • UserController.createUser() — criação.
   • UserController.updateUser() — edição.
   • UserController.deactivateUser() — desativação.
   • UserController.searchUsers() — busca.
   • PermissionService.isAdmin() — verificação de acesso.
 * * Inline editing — edição direta na tabela.
   Soft delete — desativação em vez de remoção.
   Search and filter — busca e filtros combinados.
   Pagination — paginação para grandes listas.
FUNCIONALIDADES ESPECÍFICAS:
 *   • Renderização server-side via scriptlets (<?= ?>).
 *   • Event listeners para interações do utilizador.
 *   • Feedback visual com toast notifications.
 *
 * PADRÕES:
 *   Vanilla JavaScript — sem dependências externas.
 *   Async handlers — .withSuccessHandler() e .withFailureHandler().
 *   Contextual escaping — injeção segura via scriptlets do HTML Service.
 *
 * AUTOR: Alquimia do Saber
 * VERSÃO: 1.0.0
 * ══════════════════════════════════════════════════════════════════════════════
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alquimia do Saber — Gestão de Utilizadores</title>
  <style>
    :root {
      --ia:#ff4d8d; --fil:#4cc9f0; --psi:#ff9e2c; --neu:#8b5cf6; --bio:#2dd4a0;
      --bg1:#160f2e; --bg2:#2a1a52; --card:rgba(255,255,255,.06); --text:#f3eeff; --muted:#b7a8e0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Segoe UI",system-ui,sans-serif; background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg1) 70%);
      color:var(--text); min-height:100vh; padding:28px 20px 60px; }
    header { max-width:1400px; margin:0 auto 26px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
    header h1 { font-size:clamp(1.6rem,4vw,2.2rem); }
    .btn { padding:10px 20px; border:1px solid rgba(255,255,255,.2); border-radius:12px; background:var(--card);
      color:var(--text); cursor:pointer; font-size:.9rem; transition:all .2s; text-decoration:none; display:inline-flex;
      align-items:center; gap:8px; font-family:inherit; }
    .btn:hover { background:rgba(255,255,255,.1); }
    .btn-primary { background:var(--ia); border-color:var(--ia); font-weight:600; }
    .stats { max-width:1400px; margin:0 auto 24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
    .stat-card { background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:20px; text-align:center; }
    .stat-value { font-size:2rem; font-weight:800; margin-bottom:4px; }
    .stat-label { color:var(--muted); font-size:.85rem; }
    .filters { max-width:1400px; margin:0 auto 24px; background:var(--card); border:1px solid rgba(255,255,255,.12);
      border-radius:16px; padding:20px; display:flex; gap:12px; flex-wrap:wrap; }
    .filter-input, .filter-select { padding:10px 14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15);
      border-radius:8px; color:var(--text); font-size:.9rem; font-family:inherit; min-width:200px; }
    .filter-input:focus, .filter-select:focus { outline:none; border-color:var(--ia); }
    .table-container { max-width:1400px; margin:0 auto; background:var(--card); border:1px solid rgba(255,255,255,.12);
      border-radius:16px; overflow:hidden; }
    .table { width:100%; border-collapse:collapse; }
    .table thead { background:rgba(255,255,255,.05); }
    .table th { padding:14px 16px; text-align:left; font-size:.85rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.5px; color:var(--muted); border-bottom:1px solid rgba(255,255,255,.1); }
    .table td { padding:14px 16px; font-size:.9rem; border-bottom:1px solid rgba(255,255,255,.06); }
    .table tbody tr { transition:background .2s; }
    .table tbody tr:hover { background:rgba(255,255,255,.03); }
    .badge { padding:4px 10px; border-radius:999px; font-size:.75rem; font-weight:700; text-transform:uppercase; display:inline-block; }
    .badge.admin { background:rgba(255,77,141,.2); color:var(--ia); }
    .badge.student { background:rgba(76,201,240,.2); color:var(--fil); }
    .badge.active { background:rgba(45,212,160,.2); color:var(--bio); }
    .badge.inactive { background:rgba(255,158,44,.2); color:var(--psi); }
    .pagination { display:flex; justify-content:space-between; align-items:center; padding:20px; border-top:1px solid rgba(255,255,255,.1); }
    .pagination-info { color:var(--muted); font-size:.9rem; }
    .page-btn { padding:8px 14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15);
      border-radius:8px; color:var(--text); cursor:pointer; font-size:.85rem; transition:all .2s; }
    .page-btn:hover:not(:disabled) { background:rgba(255,255,255,.1); }
    .page-btn:disabled { opacity:.4; cursor:not-allowed; }
    .toast { position:fixed; bottom:30px; right:30px; padding:16px 24px; background:var(--bio); border-radius:12px;
      color:white; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.3); opacity:0; transform:translateY(20px);
      transition:all .3s; z-index:1000; }
    .toast.show { opacity:1; transform:translateY(0); }
  </style>
<style>

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

    box-sizing: border-box;
  }
  :where(body) {
    min-width: 320px;
    max-width: 100%;
    overflow-x: hidden;
  }
  :where(main, .app, .page, .container, .content, .main-content, .dashboard, .view) {
    max-width: 100%;
  }

    max-width: 100%;
    height: auto;
  }

    overflow-wrap: anywhere;
  }

    font: inherit;
    max-width: 100%;

}
@media (max-width: 480px) {

    font-size: 16px;
  }

    grid-template-columns: 1fr !important;
  }

  }

    padding: 12px;
  }
  :where(h1) {
    font-size: clamp(1.45rem, 1.2rem + 2vw, 2rem);
  }

  }

</style>
  <style id="fleet-mobile-wcag-aa">
    /* Contrato FROTA: ergonomia S20 e WCAG 2.1 AA. */
    html, body { max-width: 100%; overflow-x: hidden; }
    :is(button, [role="button"], input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea) {
      min-width: 48px !important;
      min-height: 48px !important;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <header>
    <h1>👥 Gestão de Utilizadores</h1>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="createNewUser()">+ Novo Utilizador</button>
      <button class="btn" onclick="exportUsersCSV()">📥 Exportar CSV</button>
      <a href="?page=admin_dashboard" class="btn">← Dashboard</a>
    </div>
  </header>
  <div class="stats">
    <div class="stat-card"><div class="stat-value" id="totalUsers">0</div><div class="stat-label">Total de Utilizadores</div></div>
    <div class="stat-card"><div class="stat-value" id="activeUsers">0</div><div class="stat-label">Ativos</div></div>
    <div class="stat-card"><div class="stat-value" id="adminUsers">0</div><div class="stat-label">Administradores</div></div>
    <div class="stat-card"><div class="stat-value" id="studentUsers">0</div><div class="stat-label">Estudantes</div></div>
  </div>
  <div class="filters">
    <input inputmode="text" type="text" class="filter-input" id="searchInput" placeholder="🔍 Buscar por nome ou email...">
    <select class="filter-select" id="roleFilter">
      <option value="">Todos os papéis</option>
      <option value="admin">Administrador</option>
      <option value="student">Estudante</option>
    </select>
    <select class="filter-select" id="statusFilter">
      <option value="">Todos os status</option>
      <option value="active">Ativos</option>
      <option value="inactive">Inativos</option>
    </select>
    <button class="btn btn-primary" onclick="applyFilters()">Filtrar</button>
    <button class="btn" onclick="clearFilters()">Limpar</button>
  </div>
  <div class="table-container">
    <table class="table">
      <thead>
        <tr><th>ID</th><th>Nome</th><th>Email</th><th>Papel</th><th>Status</th><th>Último Acesso</th><th>Ações</th></tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
    <div class="pagination">
      <div class="pagination-info" id="paginationInfo">Mostrando 0-0 de 0 utilizadores</div>
      <div style="display:flex;gap:8px;">
        <button class="page-btn" id="prevBtn" onclick="prevPage()">← Anterior</button>
        <button class="page-btn" id="nextBtn" onclick="nextPage()">Próxima →</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    var DEMO_USERS=[
      {id:1,name:'Ana Silva',email:'ana.silva@escola.pt',role:'student',status:'active',lastSeen:'2026-07-18 14:23'},
      {id:2,name:'Carlos Mendes',email:'carlos.mendes@escola.pt',role:'admin',status:'active',lastSeen:'2026-07-18 14:20'},
      {id:3,name:'Beatriz Costa',email:'beatriz.costa@escola.pt',role:'student',status:'active',lastSeen:'2026-07-18 13:45'},
      {id:4,name:'Daniel Rocha',email:'daniel.rocha@escola.pt',role:'student',status:'inactive',lastSeen:'2026-07-15 10:12'},
      {id:5,name:'Elena Martins',email:'elena.martins@escola.pt',role:'student',status:'active',lastSeen:'2026-07-18 12:05'},
      {id:6,name:'Fernando Lima',email:'fernando.lima@escola.pt',role:'admin',status:'active',lastSeen:'2026-07-18 11:30'}
    ];
    var currentPage=1,pageSize=10,filteredUsers=[],filters={search:'',role:'',status:''};
    function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}
    function updateStats(users){document.getElementById('totalUsers').textContent=users.length;document.getElementById('activeUsers').textContent=users.filter(function(u){return u.status==='active';}).length;document.getElementById('adminUsers').textContent=users.filter(function(u){return u.role==='admin';}).length;document.getElementById('studentUsers').textContent=users.filter(function(u){return u.role==='student';}).length;}
    function filterUsers(users){return users.filter(function(u){if(filters.search&&!(u.name.toLowerCase().includes(filters.search.toLowerCase())||u.email.toLowerCase().includes(filters.search.toLowerCase())))return false;if(filters.role&&u.role!==filters.role)return false;if(filters.status&&u.status!==filters.status)return false;return true;});}
    function renderUsers(users,page){var tbody=document.getElementById('userTableBody');tbody.innerHTML='';if(users.length===0){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted);">Nenhum utilizador encontrado</td></tr>';document.getElementById('paginationInfo').textContent='Mostrando 0-0 de 0 utilizadores';return;}var start=(page-1)*pageSize,end=Math.min(start+pageSize,users.length),pageUsers=users.slice(start,end);pageUsers.forEach(function(u){var tr=document.createElement('tr');tr.innerHTML='<td>'+u.id+'</td><td><strong>'+u.name+'</strong></td><td>'+u.email+'</td><td><span class="badge '+u.role+'">'+(u.role==='admin'?'Admin':'Estudante')+'</span></td><td><span class="badge '+u.status+'">'+(u.status==='active'?'Ativo':'Inativo')+'</span></td><td>'+u.lastSeen+'</td><td><button class="btn" style="padding:6px 12px;font-size:.8rem;" onclick="editUser('+u.id+')">✏️</button></td>';tbody.appendChild(tr);});document.getElementById('paginationInfo').textContent='Mostrando '+(start+1)+'-'+end+' de '+users.length+' utilizadores';document.getElementById('prevBtn').disabled=page===1;document.getElementById('nextBtn').disabled=end>=users.length;}
    function applyFilters(){filters.search=document.getElementById('searchInput').value;filters.role=document.getElementById('roleFilter').value;filters.status=document.getElementById('statusFilter').value;currentPage=1;filteredUsers=filterUsers(DEMO_USERS);renderUsers(filteredUsers,currentPage);}
    function clearFilters(){document.getElementById('searchInput').value='';document.getElementById('roleFilter').value='';document.getElementById('statusFilter').value='';filters={search:'',role:'',status:''};currentPage=1;filteredUsers=DEMO_USERS;renderUsers(filteredUsers,currentPage);}
    function prevPage(){if(currentPage>1){currentPage--;renderUsers(filteredUsers,currentPage);}}
    function nextPage(){var maxPage=Math.ceil(filteredUsers.length/pageSize);if(currentPage<maxPage){currentPage++;renderUsers(filteredUsers,currentPage);}}
    function editUser(id){showToast('Edição de utilizador #'+id+' a implementar');}
    function createNewUser(){
      var name=prompt('Nome completo:');
      if(!name||name.trim().length<3){showToast('Nome deve ter no mínimo 3 caracteres');return;}
      name=name.trim();
      var email=prompt('Email:');
      if(!email||email.trim().length===0){showToast('Email é obrigatório');return;}
      email=email.trim().toLowerCase();
      var emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if(!emailRegex.test(email)){showToast('Email inválido. Use formato: exemplo@dominio.pt');return;}
      var password=prompt('Senha inicial (mínimo 6 caracteres):');
      if(!password||password.length<6){showToast('Senha deve ter no mínimo 6 caracteres');return;}
      if(password.length>50){showToast('Senha muito longa (máximo 50 caracteres)');return;}
      var role=confirm('Administrador? (Cancelar = Estudante)')?'admin':'student';
      showToast('Criando utilizador...');
      google.script.run.withSuccessHandler(function(r){
        if(r&&r.success){showToast('✓ Utilizador criado com sucesso!');setTimeout(loadUsers,500);}
        else{showToast('✗ Erro ao criar: '+(r&&r.error?r.error:'Desconhecido'));}
      }).withFailureHandler(function(e){showToast('✗ Falha na criação: '+e.message);}).api_createUser({email:email,password:password,fullName:name,role:role});
    }
    function exportUsersCSV(){
      showToast('📥 Exportando utilizadores...');
      google.script.run.withSuccessHandler(function(r){
        if(r&&r.success&&r.data){
          var csv=r.data.csv||r.data;
          var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
          var url=window.URL.createObjectURL(blob);
          var a=document.createElement('a');
          a.href=url;
          a.download='users_'+new Date().toISOString().slice(0,10)+'.csv';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
          showToast('✓ CSV exportado com sucesso! ('+(r.data.rowCount||'N/A')+' registros)');
        }else{showToast('✗ Erro ao exportar: '+(r&&r.error?r.error:'Sem dados'));}
      }).withFailureHandler(function(e){showToast('✗ Falha na exportação: '+e.message);}).api_exportUsersCSV();
    }
    function loadUsers(){if(typeof google!=='undefined'&&google.script&&google.script.run){google.script.run.withSuccessHandler(function(r){var users=r&&r.success&&r.data?r.data:DEMO_USERS;filteredUsers=users;updateStats(users);renderUsers(filteredUsers,currentPage);}).withFailureHandler(function(){filteredUsers=DEMO_USERS;updateStats(DEMO_USERS);renderUsers(filteredUsers,currentPage);}).api_getUsers();}else{filteredUsers=DEMO_USERS;updateStats(DEMO_USERS);renderUsers(filteredUsers,currentPage);}}
    loadUsers();
  </script>
</body>
</html>
