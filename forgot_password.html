<!--
 * ══════════════════════════════════════════════════════════════════════════════
 * ALQUIMIA DO SABER — forgot_password.html
 * ══════════════════════════════════════════════════════════════════════════════
 *
 * DESCRIÇÃO:
 *   Formulário de recuperação de senha. A recuperação envia instruções
 *   temporárias sem revelar o digest armazenado.
 *
 * ELEMENTOS PRINCIPAIS:
 *   • Campo de e-mail (input type="email").
   • Botão de recuperação com loading state.
   • Mensagem de sucesso/erro.
   • Link para voltar ao login.
   • Instruções de recuperação.
 *
 * INTEGRAÇÕES (google.script.run):
 *   • PasswordService.resetPassword(email, newPassword) — redefinição.
   • NotificationService.sendResultNotification() — envio de instrução.
   • RegisterService.validateEmail(email) — verificação de existência.
 * * Recovery segura — o digest nunca é devolvido ao navegador.
   Email notification — instrução enviada por e-mail.
   Single-step process — processo simplificado.
FUNCIONALIDADES ESPECÍFICAS:
 *   • Renderização server-side via scriptlets (<?= ?>).
 *   • Event listeners para interações do utilizador.
 *   • Feedback visual com toast notifications.
 *
 * PADRÕES:
 *   Vanilla JavaScript — sem dependências externas.
 *   Async handlers — .withSuccessHandler() e .withFailureHandler().
 *   Contextual escaping — injeção segura via scriptlets do HTML Service.
 *
 * AUTOR: Alquimia do Saber
 * VERSÃO: 1.0.0
 * ══════════════════════════════════════════════════════════════════════════════
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alquimia do Saber — Recuperar Senha</title>
  <style>
    :root{--ia:#ff4d8d;--fil:#4cc9f0;--bg1:#160f2e;--bg2:#2a1a52;--text:#f3eeff;--muted:#b7a8e0;--success:#2dd4a0;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg1) 70%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .container{max-width:450px;width:100%;}
    .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:40px;box-shadow:0 8px 32px rgba(0,0,0,.3);}
    .logo{text-align:center;font-size:3rem;margin-bottom:8px;}
    h1{text-align:center;font-size:1.8rem;margin-bottom:8px;}
    .subtitle{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:32px;line-height:1.6;}
    .form-group{margin-bottom:24px;}
    .form-label{display:block;margin-bottom:8px;font-size:.9rem;font-weight:600;color:var(--muted);}
    .form-input{width:100%;padding:14px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:var(--text);font-size:.95rem;font-family:inherit;transition:all .2s;}
    .form-input:focus{outline:none;border-color:var(--ia);background:rgba(255,255,255,.08);}
    .btn{width:100%;padding:14px;background:var(--ia);border:none;border-radius:12px;color:white;font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn:hover{background:#ff3377;transform:translateY(-2px);box-shadow:0 4px 16px rgba(255,77,141,.4);}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .btn .spinner{display:none;width:16px;height:16px;border:2px solid white;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;}
    .btn.loading .spinner{display:inline-block;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .back-link{text-align:center;margin-top:24px;}
    .back-link a{color:var(--fil);text-decoration:none;font-size:.9rem;}
    .back-link a:hover{text-decoration:underline;}
    .success-message{background:rgba(45,212,160,.1);border:1px solid rgba(45,212,160,.3);border-radius:12px;padding:20px;margin-bottom:24px;display:none;}
    .success-message.show{display:block;}
    .success-message .icon{font-size:2.5rem;text-align:center;margin-bottom:12px;}
    .success-message h2{text-align:center;margin-bottom:8px;font-size:1.2rem;}
    .success-message p{text-align:center;color:var(--muted);font-size:.9rem;line-height:1.6;}
    .error-message{background:rgba(255,77,141,.1);border:1px solid rgba(255,77,141,.3);border-radius:12px;padding:16px;margin-bottom:20px;color:var(--ia);font-size:.9rem;display:none;}
    .error-message.show{display:block;}
  </style>
<style>

  }

</style>
  <style id="fleet-mobile-wcag-aa">
    /* Contrato FROTA: ergonomia S20 e WCAG 2.1 AA. */
    html, body { max-width: 100%; overflow-x: hidden; }
    :is(button, [role="button"], input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea) {
      min-width: 48px !important;
      min-height: 48px !important;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">🔐</div>
      <h1>Recuperar Senha</h1>
      <p class="subtitle">Insira o seu email e enviaremos instruções para redefinir a sua senha.</p>
      <div class="success-message" id="successMessage">
        <div class="icon">✅</div>
        <h2>Email Enviado!</h2>
        <p>Verifique a sua caixa de entrada. Enviámos instruções para recuperar a sua senha.</p>
      </div>
      <div class="error-message" id="errorMessage"></div>
      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input inputmode="email" type="email" class="form-input" id="email" placeholder="seu.email@exemplo.pt" required autocomplete="email">
        </div>
        <button type="submit" class="btn" id="submitBtn">
          <span class="spinner"></span>
          <span id="btnText">Enviar Instruções</span>
        </button>
      </form>
      <div class="back-link">
        <a href="<?!= getScriptUrl() ?>?page=login" target="_top">← Voltar ao Login</a>
      </div>
    </div>
  </div>
  <script>
    var form=document.getElementById('forgotForm');
    var submitBtn=document.getElementById('submitBtn');
    var btnText=document.getElementById('btnText');
    var successMsg=document.getElementById('successMessage');
    var errorMsg=document.getElementById('errorMessage');
    form.addEventListener('submit',function(e){
      e.preventDefault();
      var email=document.getElementById('email').value;
      errorMsg.classList.remove('show');
      submitBtn.classList.add('loading');
      submitBtn.disabled=true;
      btnText.textContent='Enviando...';
      if(typeof google!=='undefined'&&google.script&&google.script.run){
        google.script.run
          .withSuccessHandler(function(result){
            submitBtn.classList.remove('loading');
            submitBtn.disabled=false;
            btnText.textContent='Enviar Instruções';
            if(result&&result.success){
              form.style.display='none';
              successMsg.classList.add('show');
              setTimeout(function(){window.top.location.href='<?= getScriptUrl() ?>'+'?page=login';},5000);
            }else{
              errorMsg.textContent=result.message||'Erro ao enviar email. Tente novamente.';
              errorMsg.classList.add('show');
            }
          })
          .withFailureHandler(function(error){
            submitBtn.classList.remove('loading');
            submitBtn.disabled=false;
            btnText.textContent='Enviar Instruções';
            errorMsg.textContent='Erro de conexão. Verifique sua internet e tente novamente.';
            errorMsg.classList.add('show');
          })
          .api_forgotPassword(email);
      }else{
        setTimeout(function(){
          submitBtn.classList.remove('loading');
          submitBtn.disabled=false;
          btnText.textContent='Enviar Instruções';
          form.style.display='none';
          successMsg.classList.add('show');
        },1500);
      }
    });
  </script>
</body>
</html>
