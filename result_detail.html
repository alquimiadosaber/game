 * ALQUIMIA DO SABER — result_detail.html
 * ══════════════════════════════════════════════════════════════════════════════
 *
 * DESCRIÇÃO:
 *   Detalhe completo de uma vocação recomendada. Descrição da carreira, competências, fórmula epistémica e recomendações de estudo.
 *
 * ELEMENTOS PRINCIPAIS:
 *   • Título da vocação e domínio.
   • Fórmula epistémica detalhada.
   • Descrição completa da carreira.
   • Competências e habilidades essenciais.
   • Domínios relacionados.
   • Recomendações de estudo (universidades, cursos).
   • Contexto de mercado (Rio AI City, Porto Maravalley).
   • Botão de compartilhar resultado.
 *
 * INTEGRAÇÕES (google.script.run):
 *   • VocationController.getVocationById(id) — dados da vocação.
   • DomainController.getDomainByCode(code) — domínio.
   • ResultService.generateReport(userId) — relatório.
   • ConfigService.getSetting() — links institucionais.
 * * Career deep-dive — informações detalhadas da carreira.
   Market context — contexto económico real (Rio AI City).
   Study recommendations — universidades e cursos sugeridos.
   Shareable — resultado pode ser compartilhado.
FUNCIONALIDADES ESPECÍFICAS:
 *   • Renderização server-side via scriptlets (<?= ?>).
 *   • Event listeners para interações do utilizador.
 *   • Feedback visual com toast notifications.
 *
 * PADRÕES:
 *   Vanilla JavaScript — sem dependências externas.
 *   Async handlers — .withSuccessHandler() e .withFailureHandler().
 *   Contextual escaping — injeção segura via scriptlets do HTML Service.
 *
 * AUTOR: Alquimia do Saber
 * VERSÃO: 1.0.0
 * ══════════════════════════════════════════════════════════════════════════════
-->

  <title>Alquimia do Saber — Resultado</title>
  <style>

<body>
  <main id="result_detail-container">
    <header><div><h1 id="title">Seu resultado vocacional</h1><p id="domain" class="muted">Carregando recomendação...</p></div><div><button type="button" id="shareButton">Compartilhar</button> <a href="?page=welcome&amp;token=<?= session && session.sessionId ? session.sessionId : '' ?>">Voltar</a></div></header>
    <p id="status" class="status" role="status" aria-live="polite">Carregando resultado...</p>
    <section class="grid"><article class="card"><h2>Sobre esta vocação</h2><p id="description" class="muted">—</p><h2>Fórmula epistémica</h2><div id="formula" class="formula"><span>—</span></div><h2>Resultado</h2><p id="score" class="muted">Nenhuma tentativa registrada.</p></article><aside class="card"><h2>Vocações relacionadas</h2><ul id="related" class="related"><li class="muted">—</li></ul></aside></section>
  </main>
  <script>
    var authToken = '<?= session && session.sessionId ? session.sessionId : "" ?>';
    function query(name) { return new URLSearchParams(window.location.search).get(name) || ''; }
    function loadResult() { return new Promise(function(resolve, reject) { if (!authToken || !window.google || !google.script || !google.script.run) { reject(new Error('Sessão indisponível.')); return; } google.script.run.withSuccessHandler(function(result) { if (!result || !result.success) { reject(new Error(result && result.error ? result.error : 'Não foi possível carregar o resultado.')); return; } resolve(result.data); }).withFailureHandler(function(error) { reject(new Error(error && error.message ? error.message : 'Falha de comunicação.')); }).api_getResultDetailDashboard(authToken, query('vocationId')); }); }
    function addText(host, value) { host.textContent = value == null || value === '' ? '—' : String(value); }
    function render(data) {
      var vocation = data.vocation, result = data.result || {}; if (!vocation) { document.getElementById('status').textContent = 'Você ainda não possui um resultado vocacional.'; return; }
      addText(document.getElementById('title'), vocation.Title || vocation.Name); addText(document.getElementById('domain'), 'Domínio ' + (vocation.Domain || '—')); addText(document.getElementById('description'), vocation.Description || 'Descrição ainda não cadastrada.'); addText(document.getElementById('score'), result.Score == null ? 'Resultado disponível.' : 'Compatibilidade registrada: ' + Math.round(Number(result.Score) || 0) + '%');
      var formula = document.getElementById('formula'); formula.innerHTML = ''; String(vocation.Formula || 'Fórmula não cadastrada').split(/[+,]/).map(function(item) { return item.trim(); }).filter(Boolean).forEach(function(item) { var tag = document.createElement('span'); tag.textContent = item; formula.appendChild(tag); });
      var related = document.getElementById('related'); related.innerHTML = ''; (data.related || []).forEach(function(item) { var row = document.createElement('li'); row.textContent = item.Title || item.VocationID; related.appendChild(row); }); if (!related.children.length) related.innerHTML = '<li class="muted">Nenhuma vocação relacionada.</li>'; document.getElementById('status').textContent = 'Resultado atualizado.';
    }
    document.getElementById('shareButton').addEventListener('click', function() { if (navigator.clipboard) navigator.clipboard.writeText(window.location.href).then(function() { document.getElementById('status').textContent = 'Link copiado.'; }); else window.print(); });
    loadResult().then(render).catch(function(error) { document.getElementById('status').textContent = error.message; document.getElementById('status').className = 'status error'; });
  </script>
</body>
