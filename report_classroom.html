<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório de turma — Alquimia do Saber</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; } body { margin: 0; min-width: 320px; }
    main { width: min(920px, 100%); margin: auto; padding: 24px; }
    header, .panel { background: #fff; border: 1px solid #dce2ec; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    h1, h2, p { margin-top: 0; }
    .controls { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: end; }
    label { display: grid; gap: 6px; font-weight: 650; }
    select, button { min-height: 48px; padding: 10px 14px; border-radius: 10px; font: inherit; }
    select { width: 100%; border: 1px solid #9aa8bd; background: #fff; }
    button { border: 0; background: #1559b7; color: #fff; font-weight: 700; cursor: pointer; }
    button.secondary { background: #e8eef8; color: #17345d; } button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 24px; color: #3c4d67; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .metric { border-left: 4px solid #18766c; background: #effaf8; padding: 14px; border-radius: 10px; }
    .metric strong { display: block; font-size: 1.35rem; margin-top: 5px; } ul { padding-left: 22px; }
    @media (max-width: 640px) { main { padding: 12px; } .controls { grid-template-columns: 1fr; } }
    @media print { body { background: #fff; } .controls, #status { display: none; } main { width: 100%; padding: 0; } .panel, header { break-inside: avoid; } }
  </style>
  <style id="fleet-mobile-wcag-aa">
    /* Contrato FROTA: ergonomia S20 e WCAG 2.1 AA. */
    html, body { max-width: 100%; overflow-x: hidden; }
    :is(button, [role="button"], input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea) {
      min-width: 48px !important;
      min-height: 48px !important;
      touch-action: manipulation;
    }
  </style>
<style>
/* codex-s20-mobile-first: Samsung S20 / Chrome mobile baseline (360x800 CSS px) */
@media screen {
  :where(html) {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  :where(*, *::before, *::after) {
    box-sizing: border-box;
  }
  :where(body) {
    min-width: 320px;
    max-width: 100%;
    overflow-x: hidden;
  }
  :where(main, .app, .page, .container, .content, .main-content, .dashboard, .view) {
    max-width: 100%;
  }
  :where(img, video, canvas, svg) {
    max-width: 100%;
    height: auto;
  }
  :where(p, li, td, th, label, legend, button, a, h1, h2, h3, h4, h5, h6) {
    overflow-wrap: anywhere;
  }
  :where(input, select, textarea, button) {
    font: inherit;
    max-width: 100%;
  }
  :where(input, select, textarea) {
    font-size: max(16px, 1rem);
  }
  :where(button, [role="button"], input, select, textarea, a) {
    touch-action: manipulation;
  }
  :where(.table-wrap, .table-wrapper, .table-responsive, .table-container, .responsive-table, .data-table-wrapper) {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
}
@media (max-width: 480px) {
  :where(body) {
    font-size: 16px;
  }
  :where(.grid, .cards, .dashboard-grid, .stats-grid, .form-grid, .filters-grid) {
    grid-template-columns: 1fr !important;
  }
  :where(.toolbar, .actions, .button-row, .filters, .form-actions, .modal-actions, .header-actions) {
    flex-direction: column;
    align-items: stretch;
  }
  :where(.btn, button, input, select, textarea) {
    min-height: 48px;
  }
  :where(table) {
    display: block;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  :where(th, td) {
    white-space: nowrap;
  }
  :where(.card, .panel, .modal, .dialog, .drawer) {
    max-width: calc(100vw - 24px);
  }
}
@media (max-width: 360px) {
  :where(body) {
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
  :where(.card, .panel, .section, .modal-content, .dialog-content) {
    padding: 12px;
  }
  :where(h1) {
    font-size: clamp(1.45rem, 1.2rem + 2vw, 2rem);
  }
  :where(h2) {
    font-size: clamp(1.2rem, 1rem + 1.4vw, 1.55rem);
  }
}
</style>
</head>
<body>
  <main>
    <header>
      <h1>Relatório de turma</h1>
      <p>Indicadores agregados para apoiar decisões pedagógicas sem expor respostas individuais.</p>
      <div class="controls">
        <label>Turma
          <select id="scope" aria-describedby="status"><option value="">Carregando turmas…</option></select>
        </label>
        <button id="generate" type="button">Gerar relatório</button>
        <button id="print" class="secondary" type="button" disabled>Imprimir</button>
      </div>
    </header>
    <p id="status" role="status" aria-live="polite">Validando acesso administrativo…</p>
    <section id="report" class="panel" hidden aria-labelledby="reportTitle">
      <h2 id="reportTitle">Indicadores da turma</h2><div id="summary" class="grid"></div>
      <h2>Distribuição por domínio</h2><ul id="domains"></ul>
      <h2>Vocações recorrentes</h2><ul id="vocations"></ul>
      <h2>Recomendações pedagógicas</h2><ul id="recommendations"></ul>
    </section>
  </main>
  <script>
    var authToken = '<?= session && session.sessionId ? session.sessionId : "" ?>';
    var scope = document.getElementById('scope'), generateButton = document.getElementById('generate');
    var printButton = document.getElementById('print'), statusNode = document.getElementById('status');
    function setStatus(message) { statusNode.textContent = message; }
    function addMetric(label, value) {
      var item = document.createElement('div'); item.className = 'metric';
      var caption = document.createElement('span'); caption.textContent = label;
      var strong = document.createElement('strong'); strong.textContent = value;
      item.append(caption, strong); return item;
    }
    function fillList(id, entries) {
      var node = document.getElementById(id); node.replaceChildren();
      (entries.length ? entries : ['Sem dados para exibir.']).forEach(function(entry) { var item = document.createElement('li'); item.textContent = entry; node.appendChild(item); });
    }
    function render(report) {
      var data = report.analytics, summary = document.getElementById('summary'); summary.replaceChildren();
      summary.append(addMetric('Estudantes', data.totalUsers), addMetric('Participantes', data.participants), addMetric('Participação', data.participationRate + '%'), addMetric('Média', data.averageScore), addMetric('Mediana', data.medianScore), addMetric('Resultados', data.totalResults));
      fillList('domains', data.domainDistribution.map(function(item) { return item.label + ': ' + item.count; }));
      fillList('vocations', data.vocationPopularity.map(function(item) { return item.label + ': ' + item.count; }));
      fillList('recommendations', report.recommendations || []);
      document.getElementById('report').hidden = false; printButton.disabled = false;
      setStatus('Relatório gerado em ' + new Date(report.generatedAt).toLocaleString('pt-BR') + '.');
    }
    function generateReport() {
      if (!scope.value) { setStatus('Selecione uma turma.'); return; }
      generateButton.disabled = true; setStatus('Gerando relatório…');
      google.script.run.withSuccessHandler(function(result) { generateButton.disabled = false; if (!result || !result.success) { setStatus((result && result.error) || 'Não foi possível gerar o relatório.'); return; } render(result.data); }).withFailureHandler(function(error) { generateButton.disabled = false; setStatus(error.message || 'Falha ao gerar o relatório.'); }).api_generateAdminReport(authToken, 'classroom', scope.value);
    }
    function loadDirectory(result) {
      if (!result || !result.success) { scope.replaceChildren(); setStatus((result && result.error) || 'Acesso não autorizado.'); return; }
      scope.replaceChildren(new Option('Selecione uma turma', ''));
      result.data.classIds.forEach(function(id) { scope.appendChild(new Option(id, id)); });
      setStatus(result.data.classIds.length ? 'Selecione uma turma para continuar.' : 'Nenhuma turma disponível.');
    }
    generateButton.addEventListener('click', generateReport); printButton.addEventListener('click', function() { window.print(); });
    google.script.run.withSuccessHandler(loadDirectory).withFailureHandler(function(error) { setStatus(error.message || 'Falha ao carregar turmas.'); }).api_getReportDirectory(authToken);
  </script>
</body>
</html>
